<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colônia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Menu inicial -->
<section id="menu" class="screen on">
  <div class="menu-box">
    <canvas id="menu-art" width="96" height="28"></canvas>
    <h1>COLÔNIA</h1>
    <p class="sub">Escolha a terra. Sobreviva nela.</p>
    <button id="m-continue" class="btn big" hidden>▶ Continuar</button>
    <button id="m-new" class="btn big">🏕 Nova colônia</button>
    <p id="m-info" class="dim"></p>
  </div>
</section>

<!-- Escolha do local -->
<section id="world" class="screen">
  <header class="bar">
    <button id="w-back" class="btn small">← Voltar</button>
    <b class="title">Onde fundar a colônia?</b>
    <label class="seed">Semente <input id="w-seed" maxlength="9" spellcheck="false"></label>
    <button id="w-new" class="btn small">🎲 Novo mundo</button>
    <span class="zoom"><button id="w-zout" class="btn small" title="Afastar">－</button><button id="w-zin" class="btn small" title="Aproximar">＋</button></span>
    <button id="w-view" class="btn small"></button>
  </header>
  <div class="wrow">
    <div id="wstage"><canvas id="wcv"></canvas></div>
    <aside id="site" class="panel">
      <div id="site-body"></div>
      <button id="w-go" class="btn primary" disabled>Fundar aqui ▶</button>
    </aside>
  </div>
</section>

<!-- Origem e colonos -->
<section id="setup" class="screen">
  <header class="bar">
    <button id="s-back" class="btn small">← Voltar</button>
    <b class="title">Quem vai com você?</b>
    <span id="s-site" class="dim"></span>
  </header>
  <div class="setup-body">
    <h2>Origem</h2>
    <div id="origins"></div>
    <h2>Colonos <button id="s-reroll" class="btn small">🎲 Sortear todos</button></h2>
    <div id="crew"></div>
    <button id="s-go" class="btn big">▶ Começar</button>
  </div>
</section>

<!-- Colônia -->
<section id="colony" class="screen">
  <header class="bar">
    <button id="c-menu" class="btn small">☰ Menu</button>
    <span class="chip" id="c-date"></span>
    <span class="chip" id="c-temp"></span>
    <b class="title" id="c-biome"></b>
    <span class="chip" title="Madeira">🪵 <b id="r-wood"></b></span>
    <span class="chip" title="Pedra">🪨 <b id="r-stone"></b></span>
    <span class="chip" title="Ferro">⛓ <b id="r-iron"></b></span>
    <span class="chip" title="Couro">🟫 <b id="r-hide"></b></span>
    <span class="chip" title="Sementes">🌰 <b id="r-seed"></b></span>
    <span class="chip" title="Comida">🍖 <b id="r-food"></b></span>
    <div id="speed"><button data-s="0">⏸</button><button data-s="1">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <aside id="crewlist"></aside>
    <div id="feed"></div>
    <div id="hover"></div>
    <div id="buildmenu" class="panel" hidden></div>
    <nav id="orders"></nav>
  </div>
</section>

<div id="modal" hidden><div class="modal-box"><h2 id="mo-title"></h2><div id="mo-body"></div><div id="mo-foot"></div></div></div>

<script src="sprites.js"></script>
<script src="game.js"></script>
</body>
</html>
