<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏴‍☠️PIRATINHA🏴‍☠️</title>
<link rel="icon" type="image/x-icon" href="./assets/icons/favicon.ico">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/os/components.css">
<link rel="stylesheet" href="./css/os/desktop.css">

<link rel="stylesheet" href="./css/os/widgets.css">
<link rel="stylesheet" href="./css/old.css">

<body data-mode="os">

<!-- ================= MODO OS ================= -->
<div id="os">
  <div id="desktop"></div>
  <div id="dock"></div>
  <div id="dockzone"></div>
  <div id="widget"></div>
  <div id="ctx"></div>
  <div id="toasts"></div>
  <div id="npanel"></div>

  <div id="start" role="dialog" aria-label="Menu Iniciar">
    <div class="starthead"><b>🏴‍☠️ PIRATINHA</b></div>
    <div class="startbar"><button id="startcust">Customização</button><button id="startset">Configurações</button></div>
    <input id="search" type="search" placeholder="Buscar site…" autocomplete="off">
    <div id="apps"></div>
    <div class="startfoot"><button class="pill" id="st-old" data-switch>Ir para o modo antigo</button><button class="pill" id="st-off">⏻ Desligar</button></div>
  </div>

  <div id="taskbar">
    <button id="startbtn" aria-label="Menu Iniciar" aria-expanded="false" data-label="Iniciar">🏴‍☠️</button>
    <div id="tools"></div>
    <div id="tasks"></div>
    <button id="bell" class="pin" data-label="Notificações" aria-label="Notificações">🔔<i class="dot"></i></button>
    <div id="clock"></div>
  </div>
</div>

<!-- ================= MODO ANTIGO ================= -->
<div id="old">
  <h1>🏴‍☠️PIRATINHA🏴‍☠️</h1>
  <div id="old-groups"></div>   <!-- grupos montados por js/shell/old-mode.js a partir de GROUPS -->
  <footer><p><a href="https://desciclopedia.org/wiki/Especial:Aleat%C3%B3ria" target="_blank">AAAAAAAAAA</a></p></footer>
  <button id="oldswitch" data-switch title="Voltar ao modo OS">Modo OS</button>
</div>
