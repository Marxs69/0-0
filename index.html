<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<style>
@font-face { font-family: "Futura"; src: url('futura medium condensed bt.ttf') format('truetype'); }

:root {
  --wallpaper: #87ceeb;                 /* azul celeste — cor de fundo padrão */
  --glass: rgba(34, 36, 40, .48);
  --glass-strong: rgba(28, 30, 34, .68);
  --glass-line: rgba(255, 255, 255, .14);
  --text: #f0f2f4;
  --text-dim: #aeb4bb;
  --accent: #4aa8ff;
  --radius: 18px;
  --taskbar-h: 58px;
  --blur: 22px;
  --tb-gap: 20px;
  --dock-h: 70px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { color-scheme: dark; }
* { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.28) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.26); border: 2px solid transparent; border-radius: 10px; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.4); background-clip: padding-box; }
body { font-family: "Futura", system-ui, sans-serif; overflow: hidden; background: var(--wallpaper); }

[data-mode="old"] #os { display: none; }
[data-mode="os"] #old { display: none; }

/* ============ MODO OS ============ */
#os {
  position: fixed; inset: 0; color: var(--text); user-select: none; -webkit-user-select: none;
  background: var(--wallpaper) center / cover no-repeat;
}
#os.dragging iframe { pointer-events: none; }

#desktop { position: absolute; inset: var(--ins-t, 0px) var(--ins-r, 0px) var(--ins-b, 78px) var(--ins-l, 0px); z-index: 1; }
.icon {
  position: absolute; width: var(--cw, 96px); height: var(--ch, 100px); display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 8px 4px; border-radius: 14px; border: 1px solid transparent; background: none;
  color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.65); font: inherit; font-size: 13px; line-height: 1.15;
  cursor: default; text-align: center; touch-action: none; transition: left .12s, top .12s;
}
.icon:hover { background: rgba(255,255,255,.22); }
.icon:focus-visible, .icon.sel { outline: none; background: rgba(255,255,255,.32); border-color: rgba(255,255,255,.7); }
.icon.drag { transition: none; z-index: 99990; opacity: .92; cursor: grabbing; }
.icon.hot { background: rgba(255,255,255,.5); border-color: #fff; }
.icon span { overflow-wrap: anywhere; pointer-events: none; }
.icon .tile { pointer-events: none; }
.tile {
  width: 46px; height: 46px; flex: none; border-radius: 13px; display: grid; place-items: center;
  background: var(--glass); border: 1px solid var(--glass-line);
  backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
  box-shadow: 0 4px 12px rgba(0,0,0,.18); overflow: hidden;
}
.tile img { width: 26px; height: 26px; }
.tile b { color: var(--text); font-size: 20px; text-shadow: none; }
.tile i { font-style: normal; font-size: 24px; text-shadow: none; }
.badge { position: absolute; top: 2px; right: 18px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; display: grid; place-items: center; text-shadow: none; }
.badge:empty { display: none; }

/* janelas */
.win {
  position: absolute; display: flex; flex-direction: column; min-width: 320px; min-height: 220px;
  background: var(--glass-strong); border: 1px solid var(--glass-line); border-radius: var(--radius);
  backdrop-filter: blur(var(--blur)) saturate(1.4); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4);
  box-shadow: 0 18px 50px rgba(0,0,0,.35); resize: both; overflow: hidden;
}
.win.min { display: none; }
.win.max { inset: max(10px, var(--ins-t, 0px)) max(10px, var(--ins-r, 0px)) max(10px, var(--ins-b, 78px)) max(10px, var(--ins-l, 0px)) !important; width: auto !important; height: auto !important; resize: none; }
.win:not(.active) { box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.win:not(.active) .bar { opacity: .7; }
.bar { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 10px 0 12px; flex: none; touch-action: none; cursor: default; border-bottom: 1px solid var(--glass-line); }
.bar .tile { width: 24px; height: 24px; border-radius: 7px; box-shadow: none; }
.bar .tile img { width: 15px; height: 15px; }
.bar .tile b { font-size: 12px; }
.bar .tile i { font-size: 14px; }
.bar .title { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wbtn { width: 30px; height: 30px; border: 0; border-radius: 9px; background: transparent; color: var(--text); font: inherit; font-size: 15px; display: grid; place-items: center; cursor: pointer; text-decoration: none; }
.wbtn:hover { background: rgba(255,255,255,.14); }
.wbtn.close:hover { background: #e5484d; }
.view { flex: 1; min-height: 0; background: #fff; margin: 0 6px; border-radius: 10px; overflow: hidden; }
.view iframe { width: 100%; height: 100%; border: 0; display: block; }
.view.sys { background: transparent; overflow: auto; margin: 0; padding: 10px 12px 12px; }
.hint { flex: none; padding: 7px 12px 8px; font-size: 12px; color: var(--text-dim); }
.hint a { color: var(--accent); }

/* listas dentro de janelas de sistema (lixeira, plano de fundo) */
.sysbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; color: var(--text-dim); }
.pill { height: 32px; padding: 0 12px; border: 1px solid var(--glass-line); border-radius: 10px; background: rgba(255,255,255,.08); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
.pill:hover { background: rgba(255,255,255,.18); }
.srow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; margin-bottom: 4px; border: 1px solid transparent; border-radius: 12px; background: rgba(255,255,255,.05); color: var(--text); font: inherit; font-size: 14px; text-align: left; }
.srow .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.srow { cursor: pointer; }
button.srow:hover { background: rgba(255,255,255,.14); }
.srow.on { border-color: var(--accent); }
.srow .tile { width: 30px; height: 30px; border-radius: 9px; box-shadow: none; }
.srow .tile img { width: 18px; height: 18px; }
.srow .tile b { font-size: 14px; }
.thumb { width: 56px; height: 36px; flex: none; border-radius: 8px; background: #3b4048 center / cover no-repeat; border: 1px solid var(--glass-line); }
.srow .pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.srow a.pill { display: inline-grid; place-items: center; width: 32px; padding: 0; text-decoration: none; }
.empty { margin: 18px 4px; font-size: 14px; color: var(--text-dim); line-height: 1.4; }

/* taskbar */
#taskbar {
  position: absolute; left: 10px; right: 10px; bottom: 10px; height: var(--taskbar-h); z-index: 99999;
  display: flex; align-items: center; gap: 8px; padding: 0 10px;
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: 20px;
  backdrop-filter: blur(var(--blur)) saturate(1.4); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4);
  box-shadow: 0 10px 30px rgba(0,0,0,.28);
}
#tasks { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.task { position: relative; flex: none; max-width: 170px; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 8px; border: 1px solid transparent; border-radius: 12px; background: rgba(255,255,255,.06); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
.task:hover { background: rgba(255,255,255,.14); }
.task.active { background: rgba(255,255,255,.18); border-color: var(--glass-line); }
.task.active::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 14px; height: 3px; margin-left: -7px; border-radius: 3px; background: var(--accent); }
.task .tile { width: 24px; height: 24px; border-radius: 7px; box-shadow: none; }
.task .tile img { width: 15px; height: 15px; }
.task .tile b { font-size: 12px; }
.task .tile i { font-size: 14px; }
.task span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#startbtn { width: 42px; height: 42px; flex: none; border: 0; border-radius: 13px; background: rgba(255,255,255,.1); font-size: 22px; cursor: pointer; }
#startbtn:hover, #startbtn[aria-expanded="true"] { background: rgba(255,255,255,.22); }
#clock { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 0 6px; font-size: 19px; text-align: center; line-height: 1.15; color: var(--text); white-space: nowrap; pointer-events: none; }
#clock small { display: block; font-size: 13px; color: var(--text-dim); }

/* fixados na taskbar */
#pins, #tools { flex: none; display: flex; gap: 6px; }
.sep { flex: none; width: 1px; height: 26px; background: var(--glass-line); margin: 0 2px; }
.pin { position: relative; flex: none; width: 42px; height: 40px; display: grid; place-items: center; padding: 0; border: 1px solid transparent; border-radius: 12px; background: rgba(255,255,255,.06); cursor: pointer; }
.pin:hover { background: rgba(255,255,255,.14); }
.pin.active { background: rgba(255,255,255,.18); border-color: var(--glass-line); }
.pin .tile { width: 26px; height: 26px; border-radius: 8px; box-shadow: none; }
.pin .tile img { width: 16px; height: 16px; }
.pin .tile b { font-size: 13px; }
.pin .tile i { font-size: 15px; }
.pin.open::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 5px; height: 3px; margin-left: -2px; border-radius: 3px; background: var(--text-dim); }
.pin.active::after { width: 14px; margin-left: -7px; background: var(--accent); }

/* dock de jogos */
#dock { position: absolute; z-index: 99997; display: flex; gap: 8px; padding: 6px; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 20px; backdrop-filter: blur(var(--blur)) saturate(1.4); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4); box-shadow: 0 10px 30px rgba(0,0,0,.25); transition: transform .2s, opacity .2s; }
.dk { position: relative; width: 52px; height: 52px; display: grid; place-items: center; padding: 0; border: 1px solid transparent; border-radius: 14px; background: none; cursor: pointer; }
.dk:hover { background: rgba(255,255,255,.14); }
.dk .tile { width: 42px; height: 42px; border-radius: 12px; }
.dk .tile i { font-size: 24px; }
.dk.open::after { content: ""; position: absolute; left: 50%; bottom: -1px; width: 5px; height: 3px; margin-left: -2px; border-radius: 3px; background: var(--text-dim); }
.dk.active::after { width: 14px; margin-left: -7px; background: var(--accent); }
.dk::before { content: attr(data-label); position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); padding: 4px 9px; border-radius: 8px; background: var(--glass-strong); border: 1px solid var(--glass-line); color: var(--text); font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; }
.dk:hover::before { opacity: 1; }

/* tamanho dos ícones, mini-apps, menu de contexto */
.icon .tile { width: var(--ts, 46px); height: var(--ts, 46px); }
.icon .tile img { width: calc(var(--ts, 46px) * .56); height: calc(var(--ts, 46px) * .56); }
.icon .tile i { font-size: calc(var(--ts, 46px) * .52); }
textarea, input[type=text] { user-select: text; -webkit-user-select: text; }
.note { width: 100%; height: 100%; resize: none; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 15px; line-height: 1.5; }
.calc { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 70px repeat(6, 1fr); gap: 6px; height: 100%; }
.calc .scr { grid-column: 1 / -1; display: flex; align-items: flex-end; justify-content: flex-end; padding: 8px 12px; font-size: 28px; overflow: hidden; background: rgba(0,0,0,.25); border-radius: 12px; }
.calc button { border: 1px solid var(--glass-line); border-radius: 12px; background: rgba(255,255,255,.08); color: var(--text); font: inherit; font-size: 20px; cursor: pointer; }
.calc button:hover { background: rgba(255,255,255,.18); }
.calc .op { background: rgba(74,168,255,.28); }
#ctx { position: fixed; z-index: 100000; min-width: 220px; padding: 6px; display: none; background: var(--glass-strong); border: 1px solid var(--glass-line); border-radius: 14px; backdrop-filter: blur(var(--blur)) saturate(1.4); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4); box-shadow: 0 14px 40px rgba(0,0,0,.35); }
#ctx button { display: block; width: 100%; padding: 9px 12px; border: 0; border-radius: 9px; background: none; color: var(--text); font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
#ctx button:hover { background: rgba(255,255,255,.14); }
.view.br { padding: 0; display: flex; flex-direction: column; overflow: hidden; }
.tabs { display: flex; align-items: center; gap: 4px; padding: 6px 8px 0; overflow-x: auto; flex: none; }
.tab { display: flex; align-items: center; gap: 6px; max-width: 180px; height: 32px; padding: 0 6px 0 12px; border-radius: 10px 10px 0 0; background: rgba(255,255,255,.06); font-size: 13px; white-space: nowrap; cursor: pointer; }
.tab.on { background: rgba(255,255,255,.18); }
.tab span { overflow: hidden; text-overflow: ellipsis; }
.addr { display: flex; gap: 6px; padding: 6px 8px; flex: none; }
.addr input { flex: 1; min-width: 0; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--glass-line); background: rgba(255,255,255,.08); color: var(--text); font: inherit; font-size: 14px; outline: 0; }
.frames { position: relative; flex: 1; min-height: 0; margin: 0 6px 6px; border-radius: 10px; overflow: hidden; background: #fff; }
.bmsg { position: absolute; inset: 0; z-index: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; background: rgba(28,30,34,.94); color: var(--text); }
.bmsg b { font-size: 18px; font-weight: normal; }
.bmsg span { max-width: 420px; font-size: 14px; line-height: 1.4; color: var(--text-dim); }
.frames iframe { width: 100%; height: 100%; border: 0; display: none; }
.pill.on { border-color: var(--accent); }

/* animações, taskbar no topo, jogos, paint, terminal, spotify */
.win { animation: wopen .14s ease-out; }
@keyframes wopen { from { opacity: 0; } }
.win.closing { opacity: 0; transition: opacity .12s; pointer-events: none; }
.noanim .win { animation: none; } .noanim .win.closing { transition: none; }
@media (prefers-reduced-motion: reduce) { .win { animation: none; } }
#os.tbtop #taskbar { bottom: auto; top: 10px; }
#os.tbtop #start { bottom: auto; top: calc(var(--taskbar-h) + var(--tb-gap)); }
.gw { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.gw canvas { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 8px; }
.hud { font-size: 14px; color: var(--text-dim); text-align: center; }
.ptools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.pcv { width: 100%; height: auto; background: #fff; border-radius: 8px; touch-action: none; cursor: crosshair; }
.term { height: 100%; overflow: auto; padding: 10px; border-radius: 10px; background: #0b0d10; color: #7cfc9a; font: 13px/1.4 ui-monospace, monospace; user-select: text; -webkit-user-select: text; }
.term .out div { white-space: pre-wrap; } .term .in { display: flex; }
.term input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: inherit; font: inherit; }
.sp { flex: 1; min-width: 0; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--glass-line); background: rgba(255,255,255,.08); color: var(--text); font: inherit; font-size: 14px; outline: 0; }

/* notificações, modal, reboot */
#bell { font-size: 18px; color: var(--text); } #bell .dot { position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: #e5484d; color: #fff; font: normal 10px/16px sans-serif; text-align: center; display: none; } #bell.alert .dot { display: block; }
#toasts { position: absolute; right: 14px; bottom: calc(var(--taskbar-h) + var(--tb-gap)); z-index: 99996; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
#os.tbtop #toasts { bottom: 20px; } #os.tbtop #npanel { bottom: auto; top: calc(var(--taskbar-h) + var(--tb-gap)); }
.toast { pointer-events: auto; display: flex; gap: 12px; align-items: center; width: 310px; padding: 12px 14px; border-radius: 14px; background: var(--glass-strong); border: 1px solid var(--glass-line); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); box-shadow: 0 12px 32px rgba(0,0,0,.35); cursor: pointer; animation: wopen .2s; }
.toast.game { background: linear-gradient(135deg, rgba(23,26,33,.96), rgba(34,48,66,.96)); border-color: rgba(102,192,244,.45); }
.toast.out { opacity: 0; transition: opacity .25s; } .noanim .toast { animation: none; }
.toast .ti { font-size: 26px; } .toast b { display: block; font-size: 14px; font-weight: normal; } .toast em { font-style: normal; font-size: 13px; color: var(--text-dim); }
#npanel { position: absolute; right: 10px; bottom: calc(var(--taskbar-h) + var(--tb-gap)); z-index: 99998; display: none; width: min(360px, calc(100vw - 20px)); max-height: 420px; overflow: auto; padding: 12px; background: var(--glass-strong); border: 1px solid var(--glass-line); border-radius: 18px; backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); box-shadow: 0 20px 50px rgba(0,0,0,.4); }
.nh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; } .nh b { font-weight: normal; }
.pill.danger { background: rgba(229,72,77,.16); border-color: rgba(229,72,77,.5); color: #ffb4b6; } .pill.danger:hover { background: rgba(229,72,77,.3); }
.modal { position: fixed; inset: 0; z-index: 100001; display: grid; place-items: center; background: rgba(0,0,0,.45); }
.modal .box { width: min(380px, calc(100vw - 32px)); padding: 20px; border-radius: 18px; background: var(--glass-strong); border: 1px solid var(--glass-line); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.modal p { margin: 0 0 16px; line-height: 1.5; } .modal .mb { display: flex; justify-content: flex-end; gap: 8px; }
.blackout { position: fixed; inset: 0; z-index: 100003; background: #000; color: #777; display: grid; place-items: center; font-size: 18px; text-align: center; padding: 24px; cursor: pointer; }
.bsod { position: fixed; inset: 0; z-index: 100004; background: #0a56b8; color: #fff; padding: 8vw; font-size: 20px; line-height: 1.5; }
.pbar { height: 10px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; } .pbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.startfoot { display: flex; justify-content: flex-end; gap: 6px; padding-top: 10px; border-top: 1px solid var(--glass-line); }

.blackout.upd { cursor: default; color: #ddd; background: #0b0d10; } .upd p { margin: 6px 0; } .upd .up2 { font-size: 28px; } .upd .uw { font-size: 14px; color: #888; }
.spin { width: 44px; height: 44px; margin: 0 auto 18px; border-radius: 50%; border: 4px solid rgba(255,255,255,.2); border-top-color: #fff; animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }

[hidden] { display: none !important; }
#storebtn { font-size: 19px; }
.pc { flex: none; width: 44px; text-align: right; color: var(--text-dim); font-size: 13px; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
.wc { position: relative; aspect-ratio: 4 / 3; border: 2px solid transparent; border-radius: 8px; background: #3b4048 center / cover no-repeat; cursor: pointer; }
.wc:hover { border-color: rgba(255,255,255,.5); } .wc.on { border-color: var(--accent); }
.wc .dl, .wc .wx { position: absolute; width: 22px; height: 22px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; text-decoration: none; cursor: pointer; }
.wc .dl { left: 4px; bottom: 4px; } .wc .wx { right: 4px; top: 4px; }
.view.sys.st { display: flex; padding: 0; overflow: hidden; }
.sd { flex: none; width: 170px; padding: 12px 8px; border-right: 1px solid var(--glass-line); display: flex; flex-direction: column; gap: 2px; }
.cat { padding: 10px 12px; border: 0; border-radius: 10px; background: none; color: var(--text); font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
.cat:hover { background: rgba(255,255,255,.1); } .cat.on { background: rgba(255,255,255,.18); }
.sm { flex: 1; min-width: 0; overflow: auto; padding: 12px 14px; }
.sbox { width: 100%; height: 38px; margin-bottom: 12px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--glass-line); background: rgba(255,255,255,.08); color: var(--text); font: inherit; font-size: 14px; outline: 0; }
.sh { margin: 14px 2px 8px; font-size: 13px; font-weight: normal; color: var(--text-dim); }
.cg { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.card { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid var(--glass-line); }
.card .tile { width: 48px; height: 48px; flex: none; } .card .tile i { font-size: 26px; } .card .tile img { width: 28px; height: 28px; }

        if (r < N - 2 && b[r + 1][c] === k && b[r + 2][c] === k) [0, 1, 2].forEach(i => s.add((r + i) * N + c));

      busy = false; draw();
