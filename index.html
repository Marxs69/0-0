            letter-spacing: 4px;

        /* Barra divisória entre "Recomendados" e "Outros" */
        .divider {
            display: flex;
            align-items: center;
            width: 60%;
            max-width: 600px;
            margin: 25px auto;
        }
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #404040;
        }
        .divider span {
            padding: 0 15px;
            font-size: 12px;
            letter-spacing: 3px;
            color: #808080;
            font-family: "Futura", "monospace";
        }

        section {
            margin-top: 20px;
        }

        /* Container dos links: agrupa as "bolhas" lado a lado, encostadas */
        .link {
            position: relative;
            font-size: 25px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
        }

        /* Cada link tem sempre a mesma borda (transparente em repouso) e o mesmo
           padding, então o hover não muda o tamanho da bolha nem desloca o texto.
           A margem negativa faz as bordas se sobreporem, ficando "encostadas". */
        .link a:link,
        .link a:visited {
            box-sizing: border-box;
            background-color: #0d0d0d; /* Cor de fundo dos links */
            color: #d9d9d9; /* Cor do texto dos links */
            padding: 20px; /* Espaçamento interno, igual nos 4 lados */
            border: 2px solid transparent; /* Borda fixa, invisível em repouso */
            border-radius: 20px; /* Bordas arredondadas */
            text-align: center; /* Alinhamento do texto dos links */
            text-decoration: none; /* Remove sublinhado */
            display: inline-block;
            margin: -1px; /* Sobrepõe as bordas para as bolhas ficarem encostadas */
        }

        .link a:hover,
        .link a:active {
            color: #0066CC; /* Cor do texto ao passar o mouse */
            background-color: transparent; /* Cor de fundo ao passar o mouse */
            border-color: #003568; /* Só a cor da borda muda, não o tamanho */
            z-index: 1; /* Garante que a borda do hover fique visível por cima das vizinhas */
            position: relative;
        }

        footer { /* Estilo do rodapé */
            color: #151515; /* Cor do texto do rodapé */
            text-align: left; /* Alinhamento do texto */
            font-size: 8px; /* Tamanho da fonte */
            position: absolute;
            bottom: 0%;
            right: 0%;
        }
        footer a:link, footer a:visited { /* Estilo dos links no rodapé */
            color: #151515; /* Cor do texto dos links */
            text-decoration: none; /* Remove sublinhado */
        }
        footer a:hover, footer a:active { /* Estilo dos links no rodapé ao passar o mouse e ao clicar */
            color: purple; /* Mantém a cor do texto */
            text-decoration: block; /* Mantém sem sublinhado */
        }
    </style>
